version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: thefattatt-db
    environment:
      POSTGRES_DB: thefattatt
      POSTGRES_USER: thefattatt
      POSTGRES_PASSWORD: thefattatt123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thefattatt"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: thefattatt-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/thefattatt
      SPRING_DATASOURCE_USERNAME: thefattatt
      SPRING_DATASOURCE_PASSWORD: thefattatt123
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
